    "kmaterialize": "^2.3.3-1.0.38"
    "@material/material-color-utilities": "^0.3.0"
    "handlebars": "^4.7.10"
    "handlebars-helpers": "^0.9.8"
    "sweetalert2": "*"
    "tippy.js": "*"
